name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare isolated paper trading data
        shell: bash
        run: |
          set -e

          rm -f paper_trade_history.json
          rm -f paper_trading_state.json
          rm -f previous_state.zip
          rm -f previous_history.zip

          rm -rf .aaxyy_runtime_data
          rm -rf candidate_state candidate_history

          mkdir -p .aaxyy_runtime_data/state
          mkdir -p .aaxyy_runtime_data/history

          echo "Production paper-trading files cleared before tests."

      - name: Restore compatible paper trading data
        if: github.event_name == 'push' || github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Searching for a compatible state/history pair."

          RUN_IDS=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/python-app.yml/runs?branch=main&status=success&per_page=100" |
            jq -r --arg current "${{ github.run_id }}" \
              '.workflow_runs[] | select(.id|tostring != $current) | .id'
          )

          FOUND_PAIR=false

          for RUN_ID in $RUN_IDS; do
            echo "Checking run $RUN_ID."

            ARTIFACTS=$(
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
            )

            STATE_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '[.artifacts[] | select(.name == "aaxyy-paper-trading-state" and .expired == false)][0].id // empty'
            )

            HISTORY_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '[.artifacts[] | select(.name == "aaxyy-paper-trade-history" and .expired == false)][0].id // empty'
            )

            if [ -z "$STATE_ID" ] || [ -z "$HISTORY_ID" ]; then
              echo "Run $RUN_ID does not contain both required artifacts."
              continue
            fi

            rm -rf candidate_state candidate_history
            mkdir -p candidate_state candidate_history

            if ! curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ID/zip" \
              -o candidate_state.zip; then
              echo "Could not download state from run $RUN_ID."
              continue
            fi

            if ! curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORY_ID/zip" \
              -o candidate_history.zip; then
              echo "Could not download history from run $RUN_ID."
              continue
            fi

            if ! unzip -oq candidate_state.zip -d candidate_state; then
              echo "Invalid state archive in run $RUN_ID."
              continue
            fi

            if ! unzip -oq candidate_history.zip -d candidate_history; then
              echo "Invalid history archive in run $RUN_ID."
              continue
            fi

            STATE_FILE="candidate_state/paper_trading_state.json"
            HISTORY_FILE="candidate_history/paper_trade_history.json"

            if [ ! -f "$STATE_FILE" ] || [ ! -f "$HISTORY_FILE" ]; then
              echo "Required JSON file missing from run $RUN_ID."
              continue
            fi

            if python - "$STATE_FILE" "$HISTORY_FILE" <<'PY'
          import json
          import math
          import sys

          state_path, history_path = sys.argv[1:3]

          try:
              with open(state_path, encoding="utf-8") as file:
                  state = json.load(file)

              with open(history_path, encoding="utf-8") as file:
                  history = json.load(file)

              if not isinstance(state, dict):
                  raise ValueError("State must be a JSON object.")

              if "balance" not in state or "position" not in state:
                  raise ValueError("State is missing required fields.")

              balance = float(state["balance"])

              if not math.isfinite(balance) or balance < 0:
                  raise ValueError("State balance is invalid.")

              if state["position"] is not None and not isinstance(
                  state["position"], dict
              ):
                  raise ValueError("Position must be an object or null.")

              if not isinstance(history, list):
                  raise ValueError("History must be a JSON list.")

              if not all(isinstance(record, dict) for record in history):
                  raise ValueError("History contains invalid records.")

              cleaned = [
                  record for record in history
                  if not (
                      record.get("symbol") == "BTCUSDT"
                      and record.get("side") == "BUY"
                      and record.get("entry_price") == 100.0
                      and record.get("exit_price") == 110.0
                      and record.get("quantity") == 1.0
                      and record.get("pnl") == 10.0
                      and record.get("reason") == "TAKE_PROFIT"
                      and record.get("balance_after") == 1010.0
                  )
              ]

              if not cleaned:
                  raise ValueError("History is empty after cleaning.")

              last_balance = float(cleaned[-1]["balance_after"])

              if not math.isfinite(last_balance):
                  raise ValueError("Last history balance is invalid.")

              if abs(balance - last_balance) > 0.01:
                  raise ValueError(
                      f"Balance mismatch: state={balance}, "
                      f"history={last_balance}"
                  )

              with open(history_path, "w", encoding="utf-8") as file:
                  json.dump(cleaned, file, indent=2)

              print(
                  f"Compatible pair: balance={balance:.2f}, "
                  f"history_records={len(cleaned)}"
              )

          except Exception as error:
              print(f"Rejected artifact pair: {error}")
              sys.exit(1)
          PY
            then
              cp "$STATE_FILE" \
                .aaxyy_runtime_data/state/paper_trading_state.json

              cp "$HISTORY_FILE" \
                .aaxyy_runtime_data/history/paper_trade_history.json

              FOUND_PAIR=true
              echo "Restored compatible state and history from run $RUN_ID."
              break
            else
              echo "Rejected incompatible data from run $RUN_ID."
            fi
          done

          rm -rf candidate_state candidate_history
          rm -f candidate_state.zip candidate_history.zip

          if [ "$FOUND_PAIR" != true ]; then
            echo "::error::No compatible state/history pair was found."
            echo "AAXYY will not run with mismatched paper-trading data."
            exit 1
          fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest

      - name: Install clean paper trading data
        shell: bash
        run: |
          set -e

          echo "Removing paper-trading files created during tests."

          rm -f paper_trade_history.json
          rm -f paper_trading_state.json

          STATE_FILE=".aaxyy_runtime_data/state/paper_trading_state.json"
          HISTORY_FILE=".aaxyy_runtime_data/history/paper_trade_history.json"

          if [ -f "$STATE_FILE" ] && [ -f "$HISTORY_FILE" ]; then
            cp "$STATE_FILE" paper_trading_state.json
            cp "$HISTORY_FILE" paper_trade_history.json
            echo "Compatible paper-trading state and history installed."
          else
            echo "::error::Compatible paper-trading data is missing."
            exit 1
          fi

      - name: Validate installed paper trading data
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import math

          with open("paper_trading_state.json", encoding="utf-8") as file:
              state = json.load(file)

          with open("paper_trade_history.json", encoding="utf-8") as file:
              history = json.load(file)

          assert isinstance(state, dict), "Invalid state format"
          assert "balance" in state and "position" in state
          assert math.isfinite(float(state["balance"]))
          assert isinstance(history, list) and history
          assert all(isinstance(record, dict) for record in history)

          synthetic = [
              record for record in history
              if (
                  record.get("symbol") == "BTCUSDT"
                  and record.get("side") == "BUY"
                  and record.get("entry_price") == 100.0
                  and record.get("exit_price") == 110.0
                  and record.get("quantity") == 1.0
                  and record.get("pnl") == 10.0
                  and record.get("reason") == "TAKE_PROFIT"
                  and record.get("balance_after") == 1010.0
              )
          ]

          assert not synthetic, "Synthetic BTC trade detected"

          last_balance = float(history[-1]["balance_after"])
          state_balance = float(state["balance"])

          assert abs(state_balance - last_balance) <= 0.01, (
              f"Balance mismatch: state={state_balance}, "
              f"history={last_balance}"
          )

          print(f"Validated history records: {len(history)}")
          print(f"Validated balance: {state_balance:.2f}")
          print("Paper-trading data is consistent.")
          PY

      - name: Run AAXYY paper trading
        run: |
          python main.py

      - name: Upload paper trade history
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: aaxyy-paper-trade-history
          path: paper_trade_history.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload paper trading state
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: aaxyy-paper-trading-state
          path: paper_trading_state.json
          if-no-files-found: error
          retention-days: 90
