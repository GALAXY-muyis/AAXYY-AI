name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Restore previous paper trading data
      if: github.event_name == 'push' || github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        echo "Looking for previous AAXYY paper-trading data..."

        RUN_IDS=$(
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/python-app.yml/runs?branch=main&status=success&per_page=10" |
          jq -r --arg current "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id|tostring != $current) | .id'
        )

        FOUND_STATE=false
        FOUND_HISTORY=false

        for RUN_ID in $RUN_IDS; do
          echo "Checking successful run: $RUN_ID"

          ARTIFACTS=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )

          if [ "$FOUND_STATE" = false ]; then
            STATE_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trading-state" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$STATE_ARTIFACT_ID" ]; then
              echo "Found paper-trading-state artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $STATE_ARTIFACT_ID"

              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip" \
                -o previous_state.zip

              unzip -o previous_state.zip

              echo "Restored paper-trading state:"
              cat paper_trading_state.json

              FOUND_STATE=true
            fi
          fi

          if [ "$FOUND_HISTORY" = false ]; then
            HISTORY_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trade-history" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$HISTORY_ARTIFACT_ID" ]; then
              echo "Found paper-trade-history artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $HISTORY_ARTIFACT_ID"

              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts/$HISTORY_ARTIFACT_ID/zip" \
                -o previous_history.zip

              unzip -o previous_history.zip

              echo "Restored paper-trade history:"
              cat paper_trade_history.json

              FOUND_HISTORY=true
            fi
          fi

          if [ "$FOUND_STATE" = true ] && [ "$FOUND_HISTORY" = true ]; then
            break
          fi
        done

        if [ "$FOUND_STATE" = false ]; then
          echo "No previous paper-trading-state artifact found."
          echo "AAXYY will start with its existing default state."
        fi

        if [ "$FOUND_HISTORY" = false ]; then
          echo "No previous paper-trade-history artifact found."
          echo "AAXYY will start with its existing history file."
        fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest

    - name: DIAGNOSTIC - inspect history before main
      shell: bash
      run: |
        echo "========================================"
        echo "AAXYY HISTORY DIAGNOSTIC"
        echo "========================================"

        if [ -f paper_trade_history.json ]; then
          echo "paper_trade_history.json EXISTS before main.py"
          echo "----------------------------------------"
          cat paper_trade_history.json
          echo "----------------------------------------"

          python - <<'PY'
        import json

        with open("paper_trade_history.json", "r", encoding="utf-8") as file:
            trades = json.load(file)

        print(f"History record count before main.py: {len(trades)}")

        for index, trade in enumerate(trades, start=1):
            print(
                f"{index}: "
                f"{trade.get('symbol')} "
                f"{trade.get('side')} "
                f"PnL={trade.get('pnl')} "
                f"Reason={trade.get('reason')}"
            )
        PY
        else
          echo "paper_trade_history.json DOES NOT EXIST before main.py"
        fi

        echo "========================================"
        echo "END HISTORY DIAGNOSTIC"
        echo "========================================"

    - name: Run AAXYY paper trading
      run: |
        python main.py

    - name: Upload paper trade history
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trade-history
        path: paper_trade_history.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Upload paper trading state
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trading-state
        path: paper_trading_state.json
        if-no-files-found: ignore
        retention-days: 90
