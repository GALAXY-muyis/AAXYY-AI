    - name: Restore previous paper trading data
      if: github.event_name == 'push' || github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        echo "Looking for previous AAXYY paper-trading data..."
        echo "Empty history artifacts will be skipped."

        RUN_IDS=$(
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/python-app.yml/runs?branch=main&status=success&per_page=100" |
          jq -r --arg current "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id|tostring != $current) | .id'
        )

        FOUND_STATE=false
        FOUND_HISTORY=false

        for RUN_ID in $RUN_IDS; do
          if [ "$FOUND_STATE" = true ] && [ "$FOUND_HISTORY" = true ]; then
            break
          fi

          echo "Checking successful run: $RUN_ID"

          ARTIFACTS=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )

          STATE_ARTIFACT_ID=$(
            echo "$ARTIFACTS" |
            jq -r \
              '.artifacts[] | select(.name == "aaxyy-paper-trading-state" and .expired == false) | .id' |
            head -n 1
          )

          HISTORY_ARTIFACT_ID=$(
            echo "$ARTIFACTS" |
            jq -r \
              '.artifacts[] | select(.name == "aaxyy-paper-trade-history" and .expired == false) | .id' |
            head -n 1
          )

          if [ "$FOUND_STATE" = false ] && [ -n "$STATE_ARTIFACT_ID" ]; then
            echo "Checking state artifact from run $RUN_ID"

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip" \
              -o candidate_state.zip

            mkdir -p candidate_state

            if unzip -oq candidate_state.zip -d candidate_state &&
              python -c 'import json; p="candidate_state/paper_trading_state.json"; d=json.load(open(p, encoding="utf-8")); assert isinstance(d, dict) and "balance" in d and "position" in d' 2>/dev/null; then
              cp candidate_state/paper_trading_state.json \
                .aaxyy_runtime_data/state/paper_trading_state.json
              FOUND_STATE=true
              echo "Restored latest valid state from run $RUN_ID."
            else
              echo "Invalid state artifact; checking older runs."
            fi

            rm -rf candidate_state candidate_state.zip
          fi

          if [ "$FOUND_HISTORY" = false ] && [ -n "$HISTORY_ARTIFACT_ID" ]; then
            echo "Checking history artifact from run $RUN_ID"

            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORY_ARTIFACT_ID/zip" \
              -o candidate_history.zip

            mkdir -p candidate_history

            if unzip -oq candidate_history.zip -d candidate_history &&
              python -c 'import json; p="candidate_history/paper_trade_history.json"; d=json.load(open(p, encoding="utf-8")); assert isinstance(d, list) and len(d) > 0' 2>/dev/null; then
              cp candidate_history/paper_trade_history.json \
                .aaxyy_runtime_data/history/paper_trade_history.json
              FOUND_HISTORY=true
              echo "Restored non-empty history from run $RUN_ID."
            else
              echo "History is empty or invalid; checking older runs."
            fi

            rm -rf candidate_history candidate_history.zip
          fi
        done

        if [ "$FOUND_STATE" = false ]; then
          echo "No valid previous paper-trading state found."
        fi

        if [ "$FOUND_HISTORY" = false ]; then
          echo "No non-empty valid previous history found."
        fi

        echo "Paper-trading state found: $FOUND_STATE"
        echo "Non-empty paper-trade history found: $FOUND_HISTORY"
