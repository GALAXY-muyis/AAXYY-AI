name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Restore previous paper trading data
      if: github.event_name == 'push' || github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        echo "Looking for previous AAXYY paper-trading data..."

        RUN_IDS=$(
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/python-app.yml/runs?branch=main&status=success&per_page=10" |
          jq -r --arg current "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id|tostring != $current) | .id'
        )

        FOUND_STATE=false
        FOUND_HISTORY=false

        for RUN_ID in $RUN_IDS; do
          echo "Checking successful run: $RUN_ID"

          ARTIFACTS=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )

          if [ "$FOUND_STATE" = false ]; then
            STATE_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trading-state" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$STATE_ARTIFACT_ID" ]; then
              echo "Found paper-trading-state artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $STATE_ARTIFACT_ID"

              if curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip" \
                -o previous_state.zip; then
                unzip -o previous_state.zip
                echo "Restored paper-trading state:"
                cat paper_trading_state.json
                FOUND_STATE=true
              else
                echo "Could not download this state artifact."
              fi
            fi
          fi

          if [ "$FOUND_HISTORY" = false ]; then
            HISTORY_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trade-history" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$HISTORY_ARTIFACT_ID" ]; then
              echo "Found paper-trade-history artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $HISTORY_ARTIFACT_ID"

              if curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORY_ARTIFACT_ID/zip" \
                -o previous_history.zip; then
                unzip -o previous_history.zip
                echo "Restored paper-trade history:"
                cat paper_trade_history.json
                FOUND_HISTORY=true
              else
                echo "Could not download this history artifact."
              fi
            fi
          fi

          if [ "$FOUND_STATE" = true ] && [ "$FOUND_HISTORY" = true ]; then
            break
          fi
        done

        if [ "$FOUND_STATE" = false ]; then
          echo "No downloadable previous paper-trading-state artifact found."
        fi

        if [ "$FOUND_HISTORY" = false ]; then
          echo "No downloadable previous paper-trade-history artifact found."
        fi

    - name: Clean synthetic paper trade history
      shell: bash
      run: |
        if [ -f paper_trade_history.json ]; then
          python -c 'import json; p="paper_trade_history.json"; trades=json.load(open(p, encoding="utf-8")); cleaned=[t for t in trades if not (t.get("symbol")=="BTCUSDT" and t.get("side")=="BUY" and t.get("entry_price")==100.0 and t.get("exit_price")==110.0 and t.get("quantity")==1.0 and t.get("pnl")==10.0 and t.get("reason")=="TAKE_PROFIT" and t.get("balance_after")==1010.0)]; print(f"Synthetic BTC trades removed: {len(trades)-len(cleaned)}"); print(f"Remaining history records: {len(cleaned)}"); json.dump(cleaned, open(p, "w", encoding="utf-8"), indent=2)'
        else
          echo "No paper_trade_history.json found. Nothing to clean."
        fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest

    - name: DIAGNOSTIC - inspect cleaned history before main
      shell: bash
      run: |
        echo "========================================"
        echo "AAXYY CLEAN HISTORY DIAGNOSTIC"
        echo "========================================"

        if [ -f paper_trade_history.json ]; then
          cat paper_trade_history.json
          echo
          echo "History record count before main.py:"
          python -c 'import json; print(len(json.load(open("paper_trade_history.json", encoding="utf-8"))))'
        else
          echo "paper_trade_history.json DOES NOT EXIST before main.py"
        fi

        echo "========================================"
        echo "END CLEAN HISTORY DIAGNOSTIC"
        echo "========================================"

    - name: Run AAXYY paper trading
      run: |
        python main.py

    - name: Upload paper trade history
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trade-history
        path: paper_trade_history.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Upload paper trading state
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trading-state
        path: paper_trading_state.json
        if-no-files-found: ignore
        retention-days: 90
