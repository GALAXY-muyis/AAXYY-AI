name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Restore previous paper trading data
      if: github.event_name == 'push' || github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        echo "Looking for previous AAXYY paper-trading data..."

        RUN_IDS=$(
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/python-app.yml/runs?branch=main&status=success&per_page=10" |
          jq -r --arg current "${{ github.run_id }}" \
            '.workflow_runs[] | select(.id|tostring != $current) | .id'
        )

        FOUND_STATE=false
        FOUND_HISTORY=false

        for RUN_ID in $RUN_IDS; do
          echo "Checking successful run: $RUN_ID"

          ARTIFACTS=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"
          )

          if [ "$FOUND_STATE" = false ]; then
            STATE_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trading-state" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$STATE_ARTIFACT_ID" ]; then
              echo "Found paper-trading-state artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $STATE_ARTIFACT_ID"

              if curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$STATE_ARTIFACT_ID/zip" \
                -o previous_state.zip; then

                unzip -o previous_state.zip

                echo "Restored paper-trading state:"
                cat paper_trading_state.json

                FOUND_STATE=true
              else
                echo "Could not download this state artifact."
                echo "Trying the next successful run..."
              fi
            fi
          fi

          if [ "$FOUND_HISTORY" = false ]; then
            HISTORY_ARTIFACT_ID=$(
              echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[] | select(.name == "aaxyy-paper-trade-history" and .expired == false) | .id' |
              head -n 1
            )

            if [ -n "$HISTORY_ARTIFACT_ID" ]; then
              echo "Found paper-trade-history artifact."
              echo "Source run: $RUN_ID"
              echo "Artifact ID: $HISTORY_ARTIFACT_ID"

              if curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORY_ARTIFACT_ID/zip" \
                -o previous_history.zip; then

                unzip -o previous_history.zip

                echo "Restored paper-trade history:"
                cat paper_trade_history.json

                FOUND_HISTORY=true
              else
                echo "Could not download this history artifact."
                echo "Trying the next successful run..."
              fi
            fi
          fi

          if [ "$FOUND_STATE" = true ] && [ "$FOUND_HISTORY" = true ]; then
            break
          fi
        done

        if [ "$FOUND_STATE" = false ]; then
          echo "No downloadable previous paper-trading-state artifact found."
          echo "AAXYY will start with its existing default state."
        fi

        if [ "$FOUND_HISTORY" = false ]; then
          echo "No downloadable previous paper-trade-history artifact found."
          echo "AAXYY will start with its existing history file."
        fi

    - name: Clean synthetic paper trade history
      shell: bash
      run: |
        if [ -f paper_trade_history.json ]; then
          python - <<'PY'
        import json

        path = "paper_trade_history.json"

        with open(path, "r", encoding="utf-8") as file:
            trades = json.load(file)

        cleaned_trades = []

        for trade in trades:
            is_synthetic_btc_trade = (
                trade.get("symbol") == "BTCUSDT"
                and trade.get("side") == "BUY"
                and trade.get("entry_price") == 100.0
                and trade.get("exit_price") == 110.0
                and trade.get("quantity") == 1.0
                and trade.get("pnl") == 10.0
                and trade.get("reason") == "TAKE_PROFIT"
                and trade.get("balance_after") == 1010.0
            )

            if not is_synthetic_btc_trade:
                cleaned_trades.append(trade)

        removed = len(trades) - len(cleaned_trades)

        with open(path, "w", encoding="utf-8") as file:
            json.dump(
                cleaned_trades,
                file,
                indent=2,
            )

        print(f"Synthetic BTC trades removed: {removed}")
        print(f"Remaining history records: {len(cleaned_trades)}")
        PY
        else
          echo "No paper_trade_history.json found. Nothing to clean."
        fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest

    - name: DIAGNOSTIC - inspect cleaned history before main
      shell: bash
      run: |
        echo "========================================"
        echo "AAXYY CLEAN HISTORY DIAGNOSTIC"
        echo "========================================"

        if [ -f paper_trade_history.json ]; then
          cat paper_trade_history.json

          python - <<'PY'
        import json

        with open("paper_trade_history.json", "r", encoding="utf-8") as file:
            trades = json.load(file)

        print(f"History record count before main.py: {len(trades)}")

        for index, trade in enumerate(trades, start=1):
            print(
                f"{index}: "
                f"{trade.get('symbol')} "
                f"{trade.get('side')} "
                f"PnL={trade.get('pnl')} "
                f"Reason={trade.get('reason')}"
            )
        PY
        else
          echo "paper_trade_history.json DOES NOT EXIST before main.py"
        fi

        echo "========================================"
        echo "END CLEAN HISTORY DIAGNOSTIC"
        echo "========================================"

    - name: Run AAXYY paper trading
      run: |
        python main.py

    - name: Upload paper trade history
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trade-history
        path: paper_trade_history.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Upload paper trading state
      if: github.event_name == 'push' || github.event_name == 'schedule'
      uses: actions/upload-artifact@v4
      with:
        name: aaxyy-paper-trading-state
        path: paper_trading_state.json
        if-no-files-found: ignore
        retention-days: 90

