
name: AAXYY Historical Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of historical days to test"
        required: true
        default: "30"
        type: choice
        options:
          - "7"
          - "30"
          - "60"
          - "90"

permissions:
  contents: read

jobs:
  historical-backtest:
    name: Run isolated historical simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backtest files
        run: |
          test -f run_historical_backtest.py
          test -f historical_signal_backtest.py
          test -f bitget_market_data_provider.py
          echo "Required backtest files found."

      - name: Run historical backtest
        env:
          BACKTEST_DAYS: ${{ inputs.days }}
        run: |
          python run_historical_backtest.py \
            --days "$BACKTEST_DAYS" \
            --symbols BTC ETH SOL XRP
            
